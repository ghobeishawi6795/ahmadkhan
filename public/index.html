<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ahmadkhan — Messenger</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#07111f">
<link rel="icon" href="/icons/icon-192.png">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#07111f;color:#edf4ff}
button,input{font:inherit}button{border:0;cursor:pointer}
.app{min-height:100vh;display:grid;place-items:center;padding:18px}
.phone{width:min(1180px,100%);height:min(900px,calc(100vh - 36px));min-height:650px;background:#0b1728;border:1px solid #213653;border-radius:28px;overflow:hidden;box-shadow:0 30px 90px #0008;display:grid;grid-template-columns:330px 1fr}
.sidebar{background:#0d1b2e;border-left:1px solid #20344f;display:flex;flex-direction:column}
.brand{padding:20px 18px 12px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:25px;font-weight:900;letter-spacing:1px}.logo b{color:#39d98a}.sub{font-size:11px;color:#7f96b3;margin-top:3px}
.icon{width:40px;height:40px;border-radius:13px;background:#152842;color:#bfe0ff;font-size:19px}.search{padding:8px 14px}.search input{width:100%;background:#14263d;border:1px solid #213b5d;color:#fff;border-radius:14px;padding:12px 14px;outline:0}
.tabs{display:flex;gap:6px;padding:10px 14px}.tabs button{flex:1;background:#13253c;color:#8299b5;border-radius:12px;padding:9px 3px;font-size:12px}.tabs .on{background:#173d36;color:#58e6a2}
.stories{display:flex;gap:10px;padding:7px 14px 12px;overflow:auto}.story{min-width:58px;text-align:center;font-size:10px;color:#91a6bf}.avatar{width:45px;height:45px;margin:auto;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#20d890,#4a7dff);font-weight:900;color:white;border:2px solid #1c344f}
.list{overflow:auto;flex:1}.chat{display:flex;gap:11px;padding:12px 15px;align-items:center;border-bottom:1px solid #142942;transition:.2s}.chat:hover,.chat.active{background:#12263f}.chat .avatar{width:48px;height:48px;min-width:48px}.ct{min-width:0;flex:1}.row{display:flex;justify-content:space-between;gap:8px}.name{font-weight:800}.time{font-size:10px;color:#7087a3}.preview{font-size:12px;color:#8298b2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px}.badge{background:#39d98a;color:#06130d;border-radius:20px;padding:2px 7px;font-size:10px;font-weight:900}
.main{display:flex;flex-direction:column;min-width:0;background:radial-gradient(circle at 80% 10%,#173452 0,#0b1728 35%);position:relative}
.header{height:76px;display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid #203650;background:#0d1b2bd9;backdrop-filter:blur(14px)}.header .avatar{width:48px;height:48px}.head{flex:1}.online{font-size:11px;color:#54dc9b;margin-top:4px}.headactions{display:flex;gap:7px}
.messages{flex:1;overflow:auto;padding:22px 7%;background-image:radial-gradient(#1b3551 1px,transparent 1px);background-size:25px 25px}.day{text-align:center;margin:4px auto 18px;background:#172a42;color:#7891ad;border-radius:15px;padding:5px 11px;width:max-content;font-size:10px}
.msg{max-width:min(72%,520px);margin:7px 0;display:flex;flex-direction:column;align-items:flex-start}.msg.me{margin-right:auto;align-items:flex-end}.bubble{background:#142943;border:1px solid #203b59;padding:10px 13px;border-radius:17px 17px 17px 5px;line-height:1.65;box-shadow:0 8px 25px #0002}.me .bubble{background:#075f48;border-color:#08765a;border-radius:17px 17px 5px 17px}.meta{font-size:9px;color:#718aa6;margin-top:3px;padding:0 6px}.reply{border-right:3px solid #48d89a;background:#0c1b2b;padding:5px 8px;border-radius:8px;margin-bottom:7px;font-size:10px;color:#94abc3}
.composer{padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;background:#0d1b2b;border-top:1px solid #203650}.composer input{flex:1;min-width:0;background:#152a43;border:1px solid #25415f;color:white;border-radius:17px;padding:12px 14px;outline:0}.send{width:46px;height:46px;border-radius:16px;background:#39d98a;color:#062017;font-weight:900}
.panel{position:absolute;inset:0;background:#081423f2;backdrop-filter:blur(16px);display:none;z-index:4;padding:22px;overflow:auto}.panel.show{display:block}.panelbox{max-width:700px;margin:auto;background:#102139;border:1px solid #294463;border-radius:24px;padding:20px;box-shadow:0 30px 80px #0008}.close{float:left;background:#19314d;color:white;border-radius:12px;padding:9px 13px}.field{margin:12px 0}.field label{display:block;font-size:11px;color:#8ca4be;margin-bottom:6px}.field input,.field select{width:100%;background:#0d1b2d;border:1px solid #27415f;color:#fff;padding:12px;border-radius:12px}.plan{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{background:#0c1a2c;border:1px solid #29435f;border-radius:17px;padding:14px}.card strong{display:block;font-size:18px}.primary{background:#39d98a;color:#062017;padding:11px 15px;border-radius:12px;font-weight:900}.danger{background:#64263a;color:#ffdce6;padding:11px 15px;border-radius:12px}
.mobile-nav{display:none}
@media(max-width:760px){.app{padding:0}.phone{height:100vh;min-height:0;border-radius:0;border:0;grid-template-columns:1fr}.sidebar{display:flex}.main{display:none}.phone.chat-open .sidebar{display:none}.phone.chat-open .main{display:flex}.header{height:68px}.back{display:block!important}.messages{padding:18px 4%}.msg{max-width:86%}.mobile-nav{display:flex;height:62px;background:#0b192a;border-top:1px solid #203650;justify-content:space-around;padding-bottom:env(safe-area-inset-bottom)}.mobile-nav button{background:none;color:#7188a4;font-size:11px;padding:7px 12px}.mobile-nav .on{color:#50e39c}.sidebar .list{padding-bottom:0}.sidebar{border:0}.phone{box-shadow:none}.headactions .optional{display:none}}
.back{display:none}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:#1d3552;color:#fff;padding:11px 18px;border-radius:14px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:88vw;text-align:center;box-shadow:0 10px 30px #0006}#toast.show{opacity:1;transform:translate(-50%,0)}
.bubble{font-size:var(--fs,15px)}h3{margin:18px 0 4px;font-size:14px;color:#39d98a}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{flex:1;min-width:70px;padding:10px 6px;border-radius:12px;background:#152842;color:#bfe0ff;font-size:12px}.seg .on{background:#39d98a;color:#062017;font-weight:800}
html[data-wall=plain] .messages{background-image:none;background-color:#0b1728}html[data-wall=green] .messages{background-image:none;background-color:#0c2a22}html[data-wall=blue] .messages{background-image:none;background-color:#0c2540}
html[data-theme=light] body{background:#e9edf2;color:#111b21}html[data-theme=light] .phone{background:#fff;border-color:#d8dee5}html[data-theme=light] .sidebar{background:#fff;border-color:#e3e8ee}
html[data-theme=light] .icon,html[data-theme=light] .close,html[data-theme=light] .seg button{background:#eef2f6;color:#3b5068}html[data-theme=light] .seg .on{background:#39d98a;color:#062017}
html[data-theme=light] .search input,html[data-theme=light] .field input,html[data-theme=light] .field select,html[data-theme=light] .composer input{background:#f0f2f5;border-color:#dfe4e8;color:#111b21}
html[data-theme=light] .tabs button{background:#f0f2f5;color:#667781}html[data-theme=light] .tabs .on{background:#d9fdd3;color:#0a7a4b}
html[data-theme=light] .chat{border-color:#eef1f4}html[data-theme=light] .chat:hover,html[data-theme=light] .chat.active{background:#f0f2f5}
html[data-theme=light] .preview,html[data-theme=light] .time,html[data-theme=light] .sub,html[data-theme=light] .meta,html[data-theme=light] .day{color:#667781}
html[data-theme=light] .main{background:#efeae2}html[data-theme=light] .header,html[data-theme=light] .composer,html[data-theme=light] .mobile-nav{background:#f0f2f5;border-color:#dfe4e8}
html[data-theme=light] .day{background:#fff}html[data-theme=light] .bubble{background:#fff;border-color:#e6e9ec;color:#111b21}html[data-theme=light] .me .bubble{background:#d9fdd3;border-color:#c6efc0}
html[data-theme=light] .panel{background:#f0f2f5f2}html[data-theme=light] .panelbox,html[data-theme=light] .card{background:#fff;border-color:#e0e5ea;color:#111b21}
html[data-theme=light] #login{background:#f0f2f5f5!important}html[data-theme=light] #login>div{background:#fff!important;border-color:#e0e5ea!important}html[data-theme=light] #toast{background:#111b21}
html[data-theme=light] .messages{background-image:none;background-color:#efeae2}html[data-theme=light][data-wall=plain] .messages{background-color:#fff}html[data-theme=light][data-wall=green] .messages{background-color:#dcefd8}html[data-theme=light][data-wall=blue] .messages{background-color:#dbe8f5}
</style>
</head>
<body>
<div id="login" style="position:fixed;inset:0;background:#07111ff5;z-index:50;display:grid;place-items:center;padding:20px"><div style="width:min(390px,100%);background:#102139;border:1px solid #294463;border-radius:24px;padding:24px"><h2>ورود به ahmadkhan</h2><p style="color:#8da6c1;font-size:12px">ورود با نام کاربری و رمز عبور</p><div class="field"><label>نام کاربری</label><input id="loginUser" autocomplete="username" autocapitalize="none"></div><div class="field"><label>رمز عبور</label><input id="loginPass" type="password" placeholder="رمز عبور" autocomplete="current-password"></div><button class="primary" style="width:100%" onclick="login()">ورود</button><div id="loginErr" style="color:#ff9aaa;font-size:11px;margin-top:10px"></div></div></div><div class="app"><div class="phone" id="phone">
<aside class="sidebar">
 <div class="brand"><div><div class="logo">ahmadkhan <b>●</b></div><div class="sub">Private community messenger</div></div><button class="icon" onclick="openPanel('settings')">⚙</button></div>
 <div class="search"><input id="search" placeholder="جستجوی گفتگو..." oninput="render()"></div>
 <div class="tabs"><button class="on" onclick="filter='all';render()">همه</button><button onclick="filter='unread';render()">خوانده‌نشده</button><button onclick="filter='groups';render()">گروه‌ها</button></div>
 <div class="stories" id="stories"></div><div class="list" id="list"></div>
 <div class="mobile-nav"><button class="on">💬<br>گفتگوها</button><button onclick="toast('بخش وضعیت آماده است')">◉<br>وضعیت</button><button onclick="openPanel('settings')">⚙<br>تنظیمات</button></div>
</aside>
<main class="main">
 <div class="header"><button class="icon back" onclick="back()">‹</button><div class="avatar" id="headAv">A</div><div class="head"><div class="name" id="headName">...</div><div class="online" id="headStatus">آنلاین</div></div><div class="headactions"><button class="icon optional" onclick="toast('تماس صوتی در نسخه بعدی متصل می‌شود')">☎</button><button class="icon" onclick="openPanel('chat')">⋮</button></div></div>
 <div class="messages" id="messages"></div>
 <div class="composer"><button class="icon" onclick="emoji()">☺</button><button class="icon" onclick="attach()">＋</button><input id="input" placeholder="پیام بنویسید..." onkeydown="if(event.key==='Enter'&&S.enter)send()"><button class="send" onclick="send()">➤</button></div>
</main>
<div class="panel" id="panel"><div class="panelbox"><button class="close" onclick="closePanel()">بستن</button><div id="panelContent"></div></div></div>
</div></div>
<script>
const API='/api'; let users=[],chats=[],currentChat=null,filter='all',me=null;
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const DEF={theme:'dark',fs:15,wall:'dots',enter:true};let S={...DEF};try{S={...DEF,...JSON.parse(localStorage.getItem('ak_settings')||'{}')}}catch{}
function applySettings(){const d=document.documentElement;let t=S.theme;if(t==='auto')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';d.dataset.theme=t;d.dataset.wall=S.wall;d.style.setProperty('--fs',S.fs+'px');const m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==='light'?'#f0f2f5':'#07111f'}
function setPref(k,v){S[k]=v;try{localStorage.setItem('ak_settings',JSON.stringify(S))}catch{}applySettings();settingsPanel()}
function toast(m){let t=$('toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t)}t.textContent=m;t.className='show';clearTimeout(t._t);t._t=setTimeout(()=>t.className='',2600)}
function render(){renderList()}
async function logout(){try{await fetch('/api/logout',{method:'POST',credentials:'include'})}catch{}location.reload()}
function settingsPanel(){const seg=(k,o)=>`<div class="seg">${o.map(([v,l])=>`<button class="${S[k]===v?'on':''}" onclick='setPref("${k}",${JSON.stringify(v)})'>${l}</button>`).join('')}</div>`;
$('panelContent').innerHTML=`<h1>تنظیمات</h1><div style="display:flex;gap:12px;align-items:center;margin:8px 0 6px">${avatar(me?.username||'?')}<div><b>${esc(me?.username||'')}</b><br><small style="color:#8da6c1">${me?.role==='admin'?'ادمین':'کاربر'}</small></div></div>
<h3>ظاهر</h3><div class="field"><label>پوسته</label>${seg('theme',[['dark','تیره'],['light','روشن'],['auto','خودکار']])}</div>
<div class="field"><label>اندازه متن پیام‌ها</label>${seg('fs',[[13,'کوچک'],[15,'متوسط'],[18,'بزرگ']])}</div>
<div class="field"><label>پس‌زمینه گفتگو</label>${seg('wall',[['dots','نقطه‌ای'],['plain','ساده'],['green','سبز'],['blue','آبی']])}</div>
<h3>گفتگو</h3><div class="field"><label>کلید Enter</label>${seg('enter',[[true,'ارسال پیام'],[false,'فقط دکمه ارسال']])}</div>
<h3>حساب</h3><div class="field"><label>نام کاربری جدید</label><input id="newUser" value="${esc(me?.username||'')}" autocapitalize="none"></div><button class="primary" onclick="changeUsername()">تغییر نام کاربری</button>
<div class="field" style="margin-top:14px"><label>رمز عبور جدید (حداقل ۱۲ کاراکتر)</label><input id="newPass" type="password" autocomplete="new-password"></div><button class="primary" onclick="changePassword()">تغییر رمز عبور</button>
${me?.role==='admin'?`<h3>مدیریت</h3><button class="primary" onclick="openPanel('admin')">مرکز مدیریت</button>`:''}
<h3>خروج</h3><button class="danger" onclick="logout()">خروج از حساب</button>`}
applySettings();
async function api(path,opt={}){const r=await fetch(API+path,{...opt,headers:{'content-type':'application/json',...(opt.headers||{})},credentials:'include'}); if(!r.ok) throw new Error((await r.text())||r.status); return r.json()}
async function login(){try{const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},credentials:'include',body:JSON.stringify({username:$('loginUser').value,password:$('loginPass').value})});if(!r.ok){let c='';try{const j=await r.json();c=(j.error||'')+(j.message?': '+j.message:'')}catch{}throw new Error((r.status===401?'نام کاربری یا رمز عبور اشتباه است':r.status===429?'تلاش بیش از حد؛ ۱۵ دقیقه صبر کنید':'خطای سرور')+' ['+r.status+(c?' '+c:'')+']')}await loadChats();$('login').style.display='none'}catch(e){$('loginErr').textContent=e.message}}
async function loadChats(){me=await api('/me'); const rows=await api('/chats');chats=rows.map(x=>({...x,u:x.id,msgs:[]}));if(!currentChat&&rows[0]) currentChat=rows[0].id; renderList(); if(currentChat) await openChat(currentChat,false)}
function avatar(name,color){return `<div class="avatar" style="background:${color||'#20c997'}">${esc((name||'?')[0])}</div>`}
function renderList(){const q=$('search').value.trim().toLowerCase(); $('list').innerHTML=chats.filter(c=>{if(filter==='groups')return false;if(!q)return true;return String(c.title||c.id).toLowerCase().includes(q)}).map(c=>`<div class="chat ${currentChat===c.u?'active':''}" onclick="openChat(${c.u})">${avatar(c.title||'گفتگو','#20c997')}<div class="ct"><div class="row"><span class="name">${esc(c.title||'گفتگو')}</span><span class="time">${esc(c.updated_at||'')}</span></div><div class="preview">${esc(c.last_message||'بدون پیام')}</div></div></div>`).join('')||'<div style="padding:25px;color:#7891ad">گفتگویی پیدا نشد.</div>'}
async function openChat(id,animate=true){currentChat=id;$('phone').classList.add('chat-open');renderList();const rows=await api('/messages/'+id);const c=chats.find(x=>x.u===id);if(c)c.msgs=rows; $('headName').textContent=c?.title||'گفتگو';$('headAv').textContent=(c?.title||'گ')[0];$('messages').innerHTML='<div class="day">امروز</div>'+rows.map(m=>`<div class="msg ${m.sender_id===me?.id?'me':''}"><div class="bubble">${esc(m.body||'')} ${m.media_id?`<br><a href="${API}/media/${m.media_id}" target="_blank" style="color:#7fe8b3">📎 ${esc(m.media_name||'رسانه')}</a>`:''}</div><div class="meta">${esc(m.created_at||'')} ${m.sender_id===me?.id?'✓✓':''}</div></div>`).join('');$('messages').scrollTop=$('messages').scrollHeight}
function back(){$('phone').classList.remove('chat-open')}
async function send(){const v=$('input').value.trim();if(!v||!currentChat)return;$('input').value='';try{await api('/messages',{method:'POST',body:JSON.stringify({chat_id:currentChat,body:v})});await loadChats()}catch(e){$('input').value=v;toast('ارسال پیام ناموفق بود: '+e.message)}}
function emoji(){$('input').value+=' 😊';$('input').focus()}
function closePanel(){$('panel').classList.remove('show')}
async function attach(){if(!currentChat)return;const inp=document.createElement('input');inp.type='file';inp.accept='image/*,audio/*';inp.onchange=async()=>{const file=inp.files[0];if(!file)return;try{let f=file;if(file.type.startsWith('image/')) f=await compressImage(file,5*1024*1024);const media=await uploadD1Media(f);await api('/messages',{method:'POST',body:JSON.stringify({chat_id:currentChat,media_id:media.media_id,media_type:f.type,media_name:f.name})});await loadChats()}catch(e){toast('ارسال فایل ناموفق بود: '+e.message)}};inp.click()}
async function adminPanel(){const [u,s]=await Promise.all([api('/admin/users'),api('/admin/storage')]);$('panelContent').innerHTML=`<h1>مرکز مدیریت ahmadkhan</h1><p style="color:#8da6c1">D1 فقط — بدون R2</p><div class="plan"><div class="card"><strong>${u.length}</strong><small>کاربر</small></div><div class="card"><strong>${s.files}</strong><small>رسانه</small></div><div class="card"><strong>${s.messages}</strong><small>پیام</small></div></div><div class="field"><label>پر شدن D1</label><div style="height:18px;background:#0a1524;border-radius:12px;overflow:hidden"><div style="height:100%;width:${Math.min(100,(s.db_bytes/s.limit_bytes)*100)}%;background:#39d98a"></div></div><small>${(s.db_bytes/1024/1024).toFixed(2)} MB از ${(s.limit_bytes/1024/1024/1024).toFixed(0)} GB</small></div><div class="field"><label>کاربر</label><select id="adminUser">${u.map(x=>`<option value="${x.id}">${esc(x.username)} — ${esc(x.role)}</option>`).join('')}</select></div><div class="field"><label>روز اشتراک</label><input id="days" type="number" value="30" min="1" max="3650"></div><button class="primary" onclick="grant()">فعال‌سازی اشتراک</button>`}
async function changeUsername(){try{const r=await api('/me/username',{method:'POST',body:JSON.stringify({username:$('newUser').value})});me.username=r.username;toast('نام کاربری تغییر کرد: '+r.username)}catch(e){toast(/username_taken/.test(e.message)?'این نام کاربری قبلاً گرفته شده':/invalid_username/.test(e.message)?'نام کاربری باید ۳ تا ۳۲ حرف انگلیسی/عدد/_/./- باشد':'خطا: '+e.message)}}
async function changePassword(){const p=$('newPass').value;if(p.length<12){toast('رمز باید حداقل ۱۲ کاراکتر باشد');return}try{await api('/me/password',{method:'POST',body:JSON.stringify({password:p})});toast('رمز عبور تغییر کرد. دوباره وارد شوید.');setTimeout(()=>location.reload(),1300)}catch(e){toast('خطا: '+e.message)}}
async function grant(){try{await api('/admin/subscription',{method:'POST',body:JSON.stringify({user_id:$('adminUser').value,days:Number($('days').value)})});toast('اشتراک ثبت شد')}catch(e){toast('خطا: '+e.message)}}
async function openPanel(type){$('panel').classList.add('show');if(type==='settings'){settingsPanel()}else if(type==='admin'){try{await adminPanel()}catch(e){$('panelContent').innerHTML='<h2>خطا</h2><p>'+esc(e.message)+'</p>'}}else $('panelContent').innerHTML='<h1>تنظیمات گفتگو</h1><p style="color:#9bb0c7">مدیریت تنظیمات گفتگو.</p><button class="primary" onclick="closePanel()">انجام شد</button>'}
async function compressImage(file,maxBytes=5*1024*1024){if(file.size<=maxBytes)return file;const bmp=await createImageBitmap(file);let scale=Math.min(1,1600/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(bmp.width*scale));c.height=Math.max(1,Math.round(bmp.height*scale));const x=c.getContext('2d');x.drawImage(bmp,0,0,c.width,c.height);for(let q=.88;q>=.35;q-=.08){const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',q));if(blob.size<=maxBytes)return new File([blob],file.name.replace(/\.[^.]+$/,'')+'.jpg',{type:'image/jpeg'});}throw new Error('نتوانست تصویر را زیر ۵ مگابایت قرار دهد')}
async function uploadD1Media(file){const init=await api('/media/init',{method:'POST',body:JSON.stringify({name:file.name,type:file.type,size:file.size})});const size=init.chunk_size;for(let p=0,part=0;p<file.size;p+=size,part++){const buf=await file.slice(p,Math.min(p+size,file.size)).arrayBuffer();let bin='';const a=new Uint8Array(buf);for(let i=0;i<a.length;i+=0x8000)bin+=String.fromCharCode(...a.subarray(i,i+0x8000));await api('/media/chunk',{method:'POST',body:JSON.stringify({media_id:init.media_id,part,data_b64:btoa(bin)})})}await api('/media/complete',{method:'POST',body:JSON.stringify({media_id:init.media_id})});return init}
