<body>
<div id="login" style="position:fixed;inset:0;background:#07111ff5;z-index:50;display:grid;place-items:center;padding:20px"><div style="width:min(390px,100%);background:#102139;border:1px solid #294463;border-radius:24px;padding:24px"><div style="text-align:center"><img src="/icons/icon-192.png" alt="" style="width:88px;height:88px;border-radius:26px;box-shadow:0 10px 28px #0005"><h2 style="margin:14px 0 2px">ahmadkhan</h2><p style="color:var(--muted);font-size:12px;margin:0 0 6px">ورود با نام کاربری و رمز عبور</p></div><div class="field"><label>نام کاربری</label><input id="loginUser" autocomplete="username" autocapitalize="none"></div><div class="field"><label>رمز عبور</label><input id="loginPass" type="password" placeholder="رمز عبور" autocomplete="current-password"></div><button class="primary" style="width:100%" onclick="login()">ورود</button><button id="loginCancel" class="icon" style="display:none;width:100%;margin-top:10px;padding:12px" onclick="$('login').style.display='none'">انصراف</button><div id="loginErr" style="color:#ff9aaa;font-size:11px;margin-top:10px"></div></div></div><div class="app"><div class="phone" id="phone">

 <div class="brand"><div class="lgrow"><img src="/icons/favicon-48.png" class="lg" alt=""><div><div class="logo">ahmadkhan</div><div class="sub">پیام‌رسان خصوصی</div></div></div><div style="display:flex;gap:6px"><button class="icon" onclick="openPanel('settings')"><i data-i="settings"></i></button></div></div>

 <div class="tabs"><button class="on" onclick="filter='all';render()">همه</button><button onclick="filter='unread';render()">خوانده‌نشده</button><button onclick="filter='groups';render()">گروه‌ها</button><button onclick="filter='arch';render()">بایگانی</button></div>
 <div class="stories" id="stories"></div><div class="list" id="list"></div>
 <div class="mobile-nav"><button class="on"><i data-i="chat"></i>گفتگوها</button><button onclick="openPanel('status')"><i data-i="status"></i>وضعیت</button><button onclick="openPanel('settings')"><i data-i="settings"></i>تنظیمات</button></div>

<script>
const API='/api'; let users=[],chats=[],currentChat=null,filter='all',me=null;
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const DEF={theme:'dark',fs:14,wall:'dots',enter:!matchMedia('(pointer:coarse)').matches,sound:true};let S={...DEF};try{S={...DEF,...JSON.parse(localStorage.getItem('ak_settings')||'{}')}}catch{}if(S.fs==15)S.fs=14;if(S.fs==18)S.fs=16;
function applySettings(){const d=document.documentElement;let t=S.theme;if(t==='auto')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';d.dataset.theme=t;d.dataset.wall=S.wall;d.style.setProperty('--fs',S.fs+'px');const m=document.querySelector('meta[name=theme-color]');if(m)m.content='#0b6b4f'}
function setPref(k,v){S[k]=v;try{localStorage.setItem('ak_settings',JSON.stringify(S))}catch{}applySettings();(curScreen||settingsPanel)()}
function toast(m){let t=$('toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t)}t.textContent=m;t.className='show';clearTimeout(t._t);t._t=setTimeout(()=>t.className='',2600)}
function render(){document.querySelectorAll('.tabs button').forEach((b,i)=>b.classList.toggle('on',['all','unread','groups','arch'][i]===filter));renderList()}
async function logout(){try{await fetch('/api/logout',{method:'POST',credentials:'include'})}catch{}location.reload()}
let panelBack=null,curScreen=null;
function panelBackBtn(){const f=panelBack;panelBack=null;f?f():closePanel()}
const go=f=>{panelBack=settingsPanel;f()};
const row2=(i,t,s,on,c='')=>`<div class="row2 ${c}" onclick="${on}"><span class="ri">${ico(i,22)}</span><div class="rt"><b>${t}</b>${s?`<small>${s}</small>`:''}</div></div>`;
const swt=(k,t,s)=>`<label class="row2"><div class="rt"><b>${t}</b>${s?`<small>${s}</small>`:''}</div><span class="sw"><input type="checkbox" ${S[k]?'checked':''} onchange="setPref('${k}',this.checked)"><i></i></span></label>`;
const segc=(k,o)=>`<div class="seg">${o.map(([v,l])=>`<button class="${S[k]===v?'on':''}" onclick='setPref("${k}",${JSON.stringify(v)})'>${l}</button>`).join('')}</div>`;
function settingsPanel(){curScreen=settingsPanel;panelBack=null;$('panelContent').innerHTML=`<h1>تنظیمات</h1><div class="row2 prof" onclick="go(profileScreen)">${avImg(me.display_name||me.username,me.avatar,64)}<div class="rt"><b style="font-size:17px">${esc(me.display_name||me.username)}</b><small>${esc(me.about||'@'+me.username)}</small></div></div><div class="sep"></div>`
+row2('lock','حساب','نام کاربری و رمز عبور','go(accountScreen)')+row2('chat','گفتگوها','پوسته، پس‌زمینه، اندازه متن','go(chatsScreen)')+row2('bell','اعلان‌ها','صدا و اعلان گوشی','go(notifScreen)')+row2('star','پیام‌های ستاره‌دار','','go(starredPanel)')+row2('users','حساب‌های من','افزودن و تعویض حساب','go(accountsScreen)')
+(me.role==='admin'?row2('shield','مدیریت','کاربران و فضای ذخیره',"openPanel('admin')"):'')+(matchMedia('(display-mode: standalone)').matches?'':row2('down','نصب برنامه','روی صفحه اصلی گوشی','installApp()'))+'<div class="sep"></div>'+row2('out','خروج از این حساب','','logout()','dang')}
function profileScreen(){curScreen=profileScreen;$('panelContent').innerHTML=`<h1>پروفایل</h1><div style="text-align:center;padding:18px 0 8px;cursor:pointer" onclick="pickAvatar()">${avImg(me.display_name||me.username,me.avatar,104)}<div class="lnk">تغییر عکس</div></div><div class="field"><label>نام</label><input id="pName" maxlength="40" value="${esc(me.display_name||'')}"></div><div class="field"><label>درباره</label><input id="pAbout" maxlength="140" value="${esc(me.about||'')}"></div><button class="primary" onclick="saveProfile()">ذخیره</button>`}
function accountScreen(){curScreen=accountScreen;$('panelContent').innerHTML=`<h1>حساب</h1><div class="field"><label>نام کاربری</label><input id="newUser" value="${esc(me.username||'')}" autocapitalize="none"></div><button class="primary" onclick="changeUsername()">تغییر نام کاربری</button><div class="field" style="margin-top:20px"><label>رمز عبور جدید (حداقل ۱۲ کاراکتر)</label><input id="newPass" type="password" autocomplete="new-password"></div><button class="primary" onclick="changePassword()">تغییر رمز عبور</button>`}
function chatsScreen(){curScreen=chatsScreen;$('panelContent').innerHTML=`<h1>گفتگوها</h1><h3>نمایش</h3><div class="field"><label>پوسته</label>${segc('theme',[['dark','تیره'],['light','روشن'],['auto','خودکار']])}</div><div class="field"><label>اندازه متن پیام‌ها</label>${segc('fs',[[13,'کوچک'],[14,'متوسط'],[16,'بزرگ']])}</div><div class="field"><label>پس‌زمینه گفتگو</label>${segc('wall',[['dots','نقطه‌ای'],['plain','ساده'],['green','سبز'],['blue','آبی']])}</div><h3>ارسال</h3>`+swt('enter','Enter پیام را می‌فرستد','اگر خاموش باشد، فقط با دکمه ارسال می‌شود')}
function notifScreen(){curScreen=notifScreen;const ok='Notification' in window&&Notification.permission==='granted';$('panelContent').innerHTML='<h1>اعلان‌ها</h1>'+swt('sound','صدای پیام جدید')+row2('bell',ok?'اعلان گوشی فعال است':'فعال‌سازی اعلان گوشی','وقتی برنامه باز یا در پس‌زمینه است','askNotif()')}
function accountsScreen(){curScreen=accountsScreen;$('panelContent').innerHTML='<h1>حساب‌های من</h1><div id="accList"></div>'+row2('plus','افزودن حساب','ورود با نام کاربری دیگر','addAccount()');loadAccounts()}
new MutationObserver(()=>{const e=$('panelContent').querySelector('h1');if(e){$('panelTitle').textContent=e.textContent;e.remove()}}).observe($('panelContent'),{childList:true});

applySettings();

const cname=c=>c.peer_name||c.title||'گفتگو';
const avImg=(n,s,z)=>{const st=(z?`width:${z}px;height:${z}px;min-width:${z}px;font-size:${Math.round(z/2.5)}px;`:'')+(s?`background:url('${s}') center/cover;`:'');return `<div class="avatar" style="${st}">${s?'':esc((n||'?')[0])}</div>`};
async function resizeImg(file,max,q,sq){const b=await createImageBitmap(file),c=document.createElement('canvas'),x=c.getContext('2d');if(sq){const m=Math.min(b.width,b.height);c.width=c.height=max;x.drawImage(b,(b.width-m)/2,(b.height-m)/2,m,m,0,0,max,max)}else{const s=Math.min(1,max/Math.max(b.width,b.height));c.width=Math.round(b.width*s);c.height=Math.round(b.height*s);x.drawImage(b,0,0,c.width,c.height)}return c.toDataURL('image/jpeg',q)}
function pickFile(cb){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=async()=>{const f=i.files[0];if(!f)return;try{cb(new File([await f.arrayBuffer()],f.name||'photo.jpg',{type:f.type}))}catch{toast('فایل خوانده نشد؛ دوباره انتخاب کنید')}};i.click()}
async function saveProfile(){try{await api('/me/profile',{method:'POST',body:JSON.stringify({display_name:$('pName').value,about:$('pAbout').value})});me=await api('/me');toast('پروفایل ذخیره شد');settingsPanel()}catch(e){toast('خطا: '+e.message)}}
function pickAvatar(){pickFile(async f=>{try{await api('/me/profile',{method:'POST',body:JSON.stringify({display_name:$('pName').value,about:$('pAbout').value,avatar:await resizeImg(f,256,.8,true)})});me=await api('/me');settingsPanel();renderStories()}catch(e){toast('خطا: '+e.message)}})}
async function renderStories(){try{const r=await api('/status'),m=new Map();r.forEach(x=>m.set(x.user_id,x));$('stories').innerHTML=`<div class="story" onclick="openPanel('status')">${avImg(me.display_name||me.username,me.avatar)}وضعیت من</div>`+[...m.values()].filter(x=>x.user_id!==me.id).map(x=>`<div class="story" onclick="openPanel('status')">${avImg(x.name,x.avatar)}${esc(x.name)}</div>`).join('')}catch{}}
async function statusPanel(){const rows=await api('/status?view=1');$('panelContent').innerHTML=`<h1>وضعیت</h1>${row2('pen','وضعیت متنی','نوشته روی پس‌زمینه رنگی','addText()')}${row2('camera','وضعیت عکس','از گالری یا دوربین','addPhoto()')}<div class="sep"></div><div id="stBox">`+(rows.length?rows.slice().reverse().map(x=>`<div class="card" style="margin:10px 0"><div style="display:flex;gap:10px;align-items:center">${avImg(x.name,x.avatar)}<div style="flex:1"><b>${esc(x.name)}${x.user_id===me.id?' (من)':''}</b><br><small style="color:var(--muted)">${esc(fmtFull(x.created_at))}</small></div>${x.user_id===me.id?`<button class="danger" onclick="delStatus(${x.id})">حذف</button>`:''}</div>${x.kind==='image'?`<img src="${x.image}" style="width:100%;border-radius:14px;margin-top:10px">${x.body?`<p>${esc(x.body)}</p>`:''}`:`<div style="background:${esc(x.bg)};color:#fff;padding:30px 16px;border-radius:14px;margin-top:10px;text-align:center;font-size:20px;white-space:pre-wrap">${esc(x.body)}</div>`}${x.user_id===me.id?`<div style="margin-top:8px;font-size:12px;color:var(--muted)">👁 ${x.views||0} بازدید${x.viewers?': '+esc(x.viewers):''}</div>`:''}</div>`).join(''):'<p style="color:var(--muted)">هنوز وضعیتی نیست.</p>')+'</div>'}
function addText(){$('stBox').innerHTML=`<textarea id="stText" maxlength="700" rows="4" placeholder="وضعیت خود را بنویسید..." style="width:100%;background:#0d1b2d;border:1px solid #27415f;color:#fff;padding:12px;border-radius:12px"></textarea><div class="field"><select id="stBg"><option value="#0b8f6a">سبز</option><option value="#2457c5">آبی</option><option value="#8e3ab8">بنفش</option><option value="#c2410c">نارنجی</option><option value="#be123c">قرمز</option></select></div><button class="primary" onclick="postStatus({kind:'text',body:$('stText').value,bg:$('stBg').value})">انتشار</button>`}
function addPhoto(){pickFile(async f=>{try{await postStatus({kind:'image',image:await resizeImg(f,720,.7),body:''})}catch(e){toast('خطا: '+e.message)}})}
async function postStatus(b){try{await api('/status',{method:'POST',body:JSON.stringify(b)});toast('وضعیت منتشر شد');await statusPanel();renderStories()}catch(e){toast('خطا: '+e.message)}}
async function delStatus(id){try{await api('/status/'+id,{method:'DELETE'});await statusPanel();renderStories()}catch(e){toast('خطا: '+e.message)}}
async function contactsPanel(){const u=await api('/users');$('panelContent').innerHTML='<h1>گفتگوی جدید</h1>'+row2('users','گروه جدید','','groupPanel()')+(me.role==='admin'?row2('plus','کاربر جدید','فقط ادمین','userPanel()'):'')+'<div class="sep"></div>'+(u.length?u.map(x=>`<div class="chat" onclick="startChat('${esc(x.id)}')">${avImg(x.display_name||x.username,x.avatar)}<div class="ct"><div class="name">${esc(x.display_name||x.username)}</div><div class="preview">${esc(x.about||'')}</div></div></div>`).join(''):'<p style="color:var(--muted)">هنوز کاربر دیگری نیست.'+(me.role==='admin'?' با دکمه «ساخت کاربر جدید» بالا یک نفر را اضافه کنید.':' ادمین باید کاربر بسازد.')+'</p>')}
async function startChat(id){try{const r=await api('/chats',{method:'POST',body:JSON.stringify({user_id:id})});closePanel();await loadChats();await openChat(r.id)}catch(e){toast('خطا: '+e.message)}}

function grow(t){updSend();t.style.height='auto';t.style.height=Math.min(t.scrollHeight,130)+'px'}
let pollBusy=false;async function poll(){if(!me||pollBusy)return;pollBusy=true;try{const rows=await api('/chats'),old=new Map(chats.map(x=>[x.id,x]));const sig=x=>[x.id,x.updated_at,x.last_message,x.unread,x.peer_read].join('|');const changed=rows.map(sig).join()!==chats.map(sig).join(),tch=rows.map(x=>x.typing_name||'').join()!==chats.map(x=>x.typing_name||'').join();chats=rows.map(x=>({...x,u:x.id,msgs:old.get(x.id)?.msgs||[]}));notifyNew(rows,old);updateBadge(rows);setPresence();if(tch&&!changed&&!document.hidden)renderList();if(changed&&!document.hidden){renderList();if(currentChat&&($('phone').classList.contains('chat-open')||innerWidth>760))await openChat(currentChat,false)}}catch{}pollBusy=false}
let pt=0;setInterval(()=>{if(document.hidden&&(pt++%5))return;poll()},4000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){renderList();if(currentChat&&($('phone').classList.contains('chat-open')||innerWidth>760))openChat(currentChat,false)}poll()});

const EMO='😀😃😄😁😆😅😂🤣😊😇🙂😉😍🥰😘😋😎🤩🥳😏😒😞😔😟😕🙁😢😭😤😠😡🤯😳🥵🥶😱😨😰🤔🤗🤭🤫😶😐😑😬🙄😴🤤😷🤒🤕🤢🤮🥴😵🤠👍👎👏🙌🙏💪👋🤝🤞👌💖💗💓💕💛💚💙💜🖤🤍💔🔥✨🎉🎂🌹🌙⭐';
function addEmo(e){const t=$('input'),s=t.selectionStart??t.value.length,x=t.selectionEnd??s;t.value=t.value.slice(0,s)+e+t.value.slice(x);t.selectionStart=t.selectionEnd=s+e.length;grow(t)}
let replyTo=null;
function showReply(){const b=$('replyBar');if(editing){b.style.display='flex';b.innerHTML=`<div style="flex:1"><b style="color:#39d98a;font-size:11px">✎ ویرایش پیام</b></div><button class="icon" onclick="cancelBar()">✕</button>`;return}if(!replyTo){b.style.display='none';return}b.style.display='flex';b.innerHTML=`<div style="flex:1;min-width:0"><b style="color:#39d98a;font-size:11px">${replyTo.mine?'شما':esc(replyTo.name)}</b><div class="preview">${esc(replyTo.text)}</div></div><button class="icon" onclick="cancelBar()">✕</button>`}
function clearReply(){replyTo=null;showReply()}

function gotoMsg(id){closePanel();const e=document.getElementById('m'+id);if(e){e.scrollIntoView({block:'center'});e.style.outline='2px solid #39d98a';setTimeout(()=>e.style.outline='',1800)}else toast('این پیام قدیمی‌تر از پیام‌های بارگذاری‌شده است')}
function fmtT(s,list){if(!s)return'';const d=new Date(String(s).replace(' ','T')+'Z');if(isNaN(d))return s;const n=new Date(),p=x=>String(x).padStart(2,'0'),t=p(d.getHours())+':'+p(d.getMinutes()),ds=x=>x.toDateString();if(ds(d)===ds(n))return t;if(!list)return d.toLocaleDateString(PC,{month:'short',day:'numeric'})+' '+t;const y=new Date(n-864e5);return ds(d)===ds(y)?'دیروز':d.toLocaleDateString(PC,{month:'short',day:'numeric'})}

const PC='fa-IR-u-ca-persian';
const pd=s=>{const d=new Date(String(s).replace(' ','T')+'Z');return isNaN(d)?null:d};
const dk=d=>new Intl.DateTimeFormat(PC).format(d);
const dayK=s=>{const d=pd(s);return d?dk(d):''};
const fmtFull=s=>{const d=pd(s);return d?new Intl.DateTimeFormat(PC,{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(d):(s||'')};
function dayL(s){const d=pd(s);if(!d)return'';const k=dk(d);if(k===dk(new Date()))return'امروز';if(k===dk(new Date(Date.now()-864e5)))return'دیروز';return d.toLocaleDateString(PC,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
const u8=b=>{const s=atob((b+'='.repeat((4-b.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(s,c=>c.charCodeAt(0))};
async function pushSubscribe(){if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window)||Notification.permission!=='granted')return false;const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();if(!sub){const {key}=await api('/push/key');sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(key)})}await api('/push/subscribe',{method:'POST',body:JSON.stringify(sub.toJSON())});return true}
async function mediaPanel(){panelBack=infoPanel;const r=await api('/chats/'+currentChat+'/media'),isI=m=>(m.media_type||'').startsWith('image/'),im=r.filter(isI),ot=r.filter(m=>!isI(m));
$('panelContent').innerHTML='<h1>رسانه و فایل‌ها</h1>'+(im.length?`<h3>عکس‌ها (${im.length})</h3><div class="mg">${im.map(m=>`<a href="${API}/media/${m.media_id}" target="_blank"><img loading="lazy" src="${API}/media/${m.media_id}" alt=""></a>`).join('')}</div>`:'')+(ot.length?`<h3>فایل‌ها (${ot.length})</h3>`+ot.map(m=>row2((m.media_type||'').startsWith('audio/')?'audio':'file',esc(m.media_name||'فایل'),esc(fmtFull(m.created_at)),`window.open('${API}/media/${m.media_id}','_blank')`)).join(''):'')+(r.length?'':'<p style="color:var(--muted);margin-top:16px">هنوز فایلی در این گفتگو نیست.</p>')}
async function api(path,opt={}){const r=await fetch(API+path,{...opt,headers:{'content-type':'application/json',...(opt.headers||{})},credentials:'include'}); if(!r.ok) throw new Error((await r.text())||r.status); return r.json()}
async function login(){try{const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},credentials:'include',body:JSON.stringify({username:$('loginUser').value,password:$('loginPass').value})});if(!r.ok){let c='';try{const j=await r.json();c=(j.error||'')+(j.message?': '+j.message:'')}catch{}throw new Error((r.status===401?'نام کاربری یا رمز عبور اشتباه است':r.status===429?'تلاش بیش از حد؛ ۱۵ دقیقه صبر کنید':'خطای سرور')+' ['+r.status+(c?' '+c:'')+']')}location.reload()}catch(e){$('loginErr').textContent=e.message}}
async function loadChats(){me=await api('/me'); const rows=await api('/chats');chats=rows.map(x=>({...x,u:x.id,msgs:[]}));if(!currentChat&&rows[0]) currentChat=rows[0].id; renderList(); if(!window._st){window._st=1;renderStories();pushSubscribe().catch(()=>{})} if(currentChat) await openChat(currentChat,false)}
function avatar(name,color){return `<div class="avatar" style="background:${color||'#20c997'}">${esc((name||'?')[0])}</div>`}
function renderList(){const q=$('search').value.trim().toLowerCase(); $('list').innerHTML=chats.filter(c=>{if(filter==='arch'?!c.archived:c.archived)return false;if(filter==='groups'&&c.kind!=='group')return false;if(filter==='unread'&&!c.unread)return false;if(!q)return true;return String(cname(c)).toLowerCase().includes(q)}).sort((a,b)=>(b.pinned||0)-(a.pinned||0)).map(c=>`<div class="chat ${currentChat===c.u?'active':''}" onclick="openChat(${c.u})">${avImg(cname(c),c.peer_avatar)}<div class="ct"><div class="row"><span class="name">${c.pinned?'📌 ':''}${esc(cname(c))}${c.muted?' 🔇':''}</span><span class="time">${esc(fmtT(c.updated_at,1))}</span></div><div class="row"><div class="preview" style="flex:1;min-width:0">${c.typing_name?'<span style="color:#39d98a">در حال نوشتن…</span>':esc(c.last_message||'بدون پیام')}</div>${c.unread?`<span class="badge">${c.unread}</span>`:''}</div></div></div>`).join('')||'<div style="padding:25px;color:#7891ad">گفتگویی پیدا نشد.</div>'}
async function openChat(id,animate=true){currentChat=id;if(animate!==false){$('phone').classList.add('chat-open');clearReply();if(editing){editing=null;showReply()}}renderList();const rows=await api('/messages/'+id);const c=chats.find(x=>x.u===id);if(c)c.msgs=rows; $('headName').textContent=c?cname(c):'گفتگو';setPresence();{const a=$('headAv'),s=c?.peer_avatar;a.style.background=s?`url('${s}') center/cover`:'';a.textContent=s?'':(c?cname(c):'گ')[0]}$('messages').innerHTML=rows.map((m,i)=>(i===0||dayK(m.created_at)!==dayK(rows[i-1].created_at)?`<div class="day">${dayL(m.created_at)}</div>`:'')+`<div class="msg ${m.sender_id===me?.id?'me':''}" id="m${m.id}" onclick="msgMenu(${m.id})"><div class="bubble">${c?.kind==='group'&&m.sender_id!==me?.id?`<div style="font-size:11px;color:#39d98a;font-weight:800;margin-bottom:3px">${esc(m.sender_name||'')}</div>`:''}${m.reply_to?`<div class="reply"><b>${m.reply_sender===me?.id?'شما':esc(m.reply_name||'')}</b><br>${esc(m.reply_body||'پیام حذف شده')}</div>`:''}${m.deleted?'<i style="opacity:.6">🚫 این پیام حذف شد</i>':esc(m.body||'')} ${m.media_id?mediaHtml(m):''}</div><div class="meta">${rxHtml(m)}${m.starred?'<span style="color:#f5c542">★</span> ':''}${m.edited?'ویرایش‌شده · ':''}${esc(fmtT(m.created_at))} ${m.sender_id===me?.id?(c&&c.peer_read>=m.id?'<span style="color:#53bdeb">✓✓</span>':'✓'):''}</div></div>`).join('');$('messages').scrollTop=$('messages').scrollHeight;const mx=rows.length?rows[rows.length-1].id:0;if(c&&c.unread>0&&mx&&!document.hidden&&($('phone').classList.contains('chat-open')||innerWidth>760)){c.unread=0;renderList();api('/chats/'+id+'/read',{method:'POST',body:JSON.stringify({upto:mx})}).catch(()=>{})}}
function back(){$('phone').classList.remove('chat-open')}
async function send(){const v=$('input').value.trim();if(!v||!currentChat)return;if(editing){const e=editing;editing=null;showReply();try{await api('/messages/'+e.id,{method:'PUT',body:JSON.stringify({body:v})});$('input').value='';grow($('input'));await loadChats()}catch(x){editing=e;showReply();toast('ویرایش ممکن نیست (حداکثر ۱۵ دقیقه): '+x.message)}return}const rt=replyTo;clearReply();$('input').value='';grow($('input'));try{await api('/messages',{method:'POST',body:JSON.stringify({chat_id:currentChat,body:v,reply_to:rt?.id})});await loadChats()}catch(e){replyTo=rt;showReply();$('input').value=v;grow($('input'));toast('ارسال پیام ناموفق بود: '+e.message)}}
function emoji(){const b=$('emojiBox');if(!b.dataset.f){b.dataset.f=1;b.innerHTML=[...EMO].map(e=>`<button onclick="addEmo('${e}')">${e}</button>`).join('')}b.classList.toggle('show')}
function closePanel(){$('panel').classList.remove('show')}
async function attachGo(acc,cap){if(!currentChat)return;const inp=document.createElement('input');inp.type='file';inp.accept=acc;if(cap)inp.setAttribute('capture','environment');inp.onchange=async()=>{const file=inp.files[0];if(!file)return;try{toast('در حال آماده‌سازی فایل...');let bytes;try{bytes=await file.arrayBuffer()}catch{throw new Error('فایل خوانده نشد. آن را دوباره انتخاب کنید (ترجیحاً از «فایل‌ها» یا «گالری»، نه از Drive یا «اخیر»)')}const ext=(file.name||'').split('.').pop().toLowerCase(),type=file.type||EXT[ext]||'';if(!type)throw new Error('نوع فایل پشتیبانی نمی‌شود');let f=new File([bytes],file.name||('file.'+ext),{type});if(type.startsWith('image/')) f=await compressImage(f,5*1024*1024);toast('در حال ارسال فایل...');const media=await uploadD1Media(f);await api('/messages',{method:'POST',body:JSON.stringify({chat_id:currentChat,media_id:media.media_id,media_type:f.type,media_name:f.name})});await loadChats()}catch(e){toast(/NotReadable|could not be read/i.test(e.name+e.message)?'فایل خوانده نشد؛ دوباره انتخاب کنید':'ارسال فایل ناموفق بود: '+e.message)}};inp.click()}
async function adminPanel(){const [u,s]=await Promise.all([api('/admin/users'),api('/admin/storage')]);$('panelContent').innerHTML=`<h1>مرکز مدیریت ahmadkhan</h1><p style="color:var(--muted);font-size:12.5px;margin:2px 0 10px">فقط روی D1 — بدون R2</p><div class="plan"><div class="card"><strong>${u.length}</strong><small>کاربر</small></div><div class="card"><strong>${s.files}</strong><small>رسانه</small></div><div class="card"><strong>${s.messages}</strong><small>پیام</small></div></div><div class="field"><label>پر شدن D1</label><div style="height:8px;background:var(--surface2);border-radius:6px;overflow:hidden"><div style="height:100%;width:${Math.min(100,(s.db_bytes/s.limit_bytes)*100)}%;background:#39d98a"></div></div><small>${(s.db_bytes/1024/1024).toFixed(2)} MB از ${(s.limit_bytes/1024/1024/1024).toFixed(0)} GB</small></div><h3>تمدید اشتراک</h3><div class="field"><label>کاربر</label><select id="adminUser">${u.map(x=>`<option value="${x.id}">${esc(x.username)} — ${esc(x.role)}</option>`).join('')}</select></div><div class="field"><label>روز اشتراک</label><input id="days" type="number" value="30" min="1" max="3650"></div><button class="primary" onclick="grant()">فعال‌سازی اشتراک</button><h3>کاربر جدید</h3><div class="field"><label>نام کاربری</label><input id="cuU" autocapitalize="none"></div><div class="field"><label>رمز عبور (حداقل ۸ کاراکتر)</label><input id="cuP"></div><div class="field"><label>نقش</label><select id="cuR"><option value="user">کاربر</option><option value="admin">ادمین</option></select></div><div class="field"><label>روز اشتراک</label><input id="cuD" type="number" value="30"></div><button class="primary" onclick="createUser()">ساخت کاربر</button><small style="color:var(--muted);display:block;margin-top:6px">اگر نام کاربری وجود داشته باشد، رمز و نقش آن به‌روز می‌شود.</small>`}
async function changeUsername(){try{const r=await api('/me/username',{method:'POST',body:JSON.stringify({username:$('newUser').value})});me.username=r.username;toast('نام کاربری تغییر کرد: '+r.username)}catch(e){toast(/username_taken/.test(e.message)?'این نام کاربری قبلاً گرفته شده':/invalid_username/.test(e.message)?'نام کاربری باید ۳ تا ۳۲ حرف انگلیسی/عدد/_/./- باشد':'خطا: '+e.message)}}
async function changePassword(){const p=$('newPass').value;if(p.length<12){toast('رمز باید حداقل ۱۲ کاراکتر باشد');return}try{await api('/me/password',{method:'POST',body:JSON.stringify({password:p})});toast('رمز عبور تغییر کرد. دوباره وارد شوید.');setTimeout(()=>location.reload(),1300)}catch(e){toast('خطا: '+e.message)}}
async function grant(){try{await api('/admin/subscription',{method:'POST',body:JSON.stringify({user_id:$('adminUser').value,days:Number($('days').value)})});toast('اشتراک ثبت شد')}catch(e){toast('خطا: '+e.message)}}
async function openPanel(type){$('panel').classList.add('show');$('panelTitle').textContent='';panelBack=null;if(type==='settings'){settingsPanel()}else if(type==='status'){try{await statusPanel()}catch(e){toast(e.message)}}else if(type==='chat'){try{await infoPanel()}catch(e){toast(e.message)}}else if(type==='contacts'){try{await contactsPanel()}catch(e){toast(e.message)}}else if(type==='admin'){try{await adminPanel()}catch(e){$('panelContent').innerHTML='<h2>خطا</h2><p>'+esc(e.message)+'</p>'}}else $('panelContent').innerHTML='<h1>تنظیمات گفتگو</h1><p style="color:#9bb0c7">مدیریت تنظیمات گفتگو.</p><button class="primary" onclick="closePanel()">انجام شد</button>'}
async function compressImage(file,maxBytes=5*1024*1024){if(file.size<=maxBytes)return file;const bmp=await createImageBitmap(file);let scale=Math.min(1,1600/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(bmp.width*scale));c.height=Math.max(1,Math.round(bmp.height*scale));const x=c.getContext('2d');x.drawImage(bmp,0,0,c.width,c.height);for(let q=.88;q>=.35;q-=.08){const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',q));if(blob.size<=maxBytes)return new File([blob],file.name.replace(/\.[^.]+$/,'')+'.jpg',{type:'image/jpeg'});}throw new Error('نتوانست تصویر را زیر ۵ مگابایت قرار دهد')}
async function uploadD1Media(file){const init=await api('/media/init',{method:'POST',body:JSON.stringify({name:file.name,type:file.type,size:file.size})});const size=init.chunk_size;for(let p=0,part=0;p<file.size;p+=size,part++){const buf=await file.slice(p,Math.min(p+size,file.size)).arrayBuffer();let bin='';const a=new Uint8Array(buf);for(let i=0;i<a.length;i+=0x8000)bin+=String.fromCharCode(...a.subarray(i,i+0x8000));await api('/media/chunk',{method:'POST',body:JSON.stringify({media_id:init.media_id,part,data_b64:btoa(bin)})})}await api('/media/complete',{method:'POST',body:JSON.stringify({media_id:init.media_id})});return init}
$('search').addEventListener('input',renderList); 
if('serviceWorker' in navigator && location.protocol!=='file:') navigator.serviceWorker.register('/sw.js').catch(()=>{});
if(location.protocol==='file:'){$('loginErr').textContent='این فایل برای ظاهر است؛ برای اتصال واقعی باید روی Cloudflare Worker اجرا شود'} else loadChats().then(()=>{$('login').style.display='none'}).catch(e=>{$('list').innerHTML='<div style="padding:25px;color:#ff9aaa">اتصال D1 برقرار نیست: '+esc(e.message)+'</div>'});
</script>
